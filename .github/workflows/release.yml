# Release: triggered by a v* tag (v26.1.0). Tests, packages and launch-verifies the Skyline external tool,
# then publishes a GitHub Release with SkylineGlimpse.zip and release-notes/RELEASE_NOTES_v{version}.md.
# Modeled on Skyline-PRISM's dotnet-release.yml.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tool:
    runs-on: windows-latest
    # The vendor-license flag as an environment variable, which every MSBuild evaluation sees.
    # Directory.Build.rsp does not reach the restore that dotnet build/test run first, so on a fresh
    # pwiz-sharp checkout Waters.csproj (referenced only with the flag) was built but never restored.
    env:
      IAgreeToVendorLicenses: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Both version sources must match the tag (v26.1.0 -> 26.1.0).
      - name: Verify version matches tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's/^Version *= *//p' src/Glimpse.App/tool-inf/info.properties | tr -d '[:space:]')
          PROPS=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | tr -d '[:space:]')
          echo "tag=$TAG manifest=$VER props=$PROPS"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::info.properties Version ($VER) does not match tag ($TAG)"
            exit 1
          fi
          if [ "$TAG" != "$PROPS" ]; then
            echo "::error::Directory.Build.props Version ($PROPS) does not match tag ($TAG)"
            exit 1
          fi

      - name: Check out pwiz-sharp
        uses: ./.github/actions/checkout-pwiz-sharp

      # The Panorama test needs credentials CI does not have; package-and-verify.ps1 runs it locally.
      # The test project, as CI tests it, not Glimpse.sln: the solution lists the pwiz-sharp projects at
      # their local sibling path (..\..\ProteoWizard), which does not exist on the runner.
      - name: Test
        run: dotnet test tests/Glimpse.Tests --configuration Release --filter "Category!=PanoramaData"

      - name: Package SkylineGlimpse.zip
        run: dotnet msbuild build/package.proj /p:Configuration=Release

      - name: Launch-verify the packaged tool
        shell: pwsh
        run: ./build/verify-tool.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: skyline-tool
          path: publish/SkylineGlimpse.zip
          if-no-files-found: error

  release:
    needs: [tool]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The tag is v<version> and the notes are RELEASE_NOTES_v<version>.md. Fail clearly rather than
      # publish a release with an empty body.
      - name: Locate the release notes
        id: notes
        run: |
          NOTES="release-notes/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Expected release notes at $NOTES. Rename release-notes/RELEASE_NOTES_next.md to match the tag before tagging (see Releases in CLAUDE.md)."
            exit 1
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body_path: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
