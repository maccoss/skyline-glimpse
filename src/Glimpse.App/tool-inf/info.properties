Name = Glimpse
Version = 26.2.0
Identifier = URN:LSID:maccosslab.org:SkylineGlimpse
Author = MacCoss Lab
Organization = MacCoss Lab, UW
Provider = https://skyline.ms
Languages = C#
Description = Glimpse is a raw-data browser for the open Skyline document, in the spirit of QualBrowser and FreeStyle. Browse TIC and base-peak chromatograms (MS1 or MS2, in ions/s or ions) and m/z-by-retention-time heatmaps, and click any point to see the spectrum with the fragment ions of every document peptide in it labeled and colored by peptide. Overlay XICs for any number of selected peptides or proteins, and see which signals in each spectrum belong to which peptides and proteins.\
\
Requires Skyline-daily, the .NET 10.0 Desktop Runtime, and Windows 10 version 2004 or later.
